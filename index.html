<style>
:root{--bg:#050914;--bg2:#0a1226;--card:#0e1a35;--line:#1a2b52;--blue:#2f7bff;--cyan:#38bdf8;--text:#e8eefc;--mute:#8da2c8;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
h2.title{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;text-align:center;margin-bottom:44px}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031024;font-weight:700;border:0;cursor:pointer;font:inherit;font-weight:700;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(47,123,255,.4)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.ph{background:linear-gradient(135deg,var(--card),var(--bg2));display:grid;place-items:center;color:var(--mute);font-weight:700}

/* nav */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(5,9,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{font-weight:800;font-size:1.2rem;color:var(--cyan)}
nav ul{display:flex;gap:28px}
nav ul a{color:var(--mute);font-weight:500;transition:color .2s}
nav ul a:hover{color:var(--text)}
#burger{display:none;background:none;border:0;color:var(--text);font-size:1.6rem;cursor:pointer}

/* hero */
#home{padding-top:140px;min-height:100vh;display:flex;align-items:center;background:radial-gradient(700px 400px at 80% 30%,rgba(47,123,255,.22),transparent 70%)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h3{font-size:1.2rem;font-weight:500;color:var(--mute)}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;line-height:1.1;margin:6px 0 16px}
.hero .role{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;line-height:1.15;color:var(--cyan)}
.hero .role span{display:block}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
.socials a{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;color:var(--mute);transition:.2s}
.socials a:hover{border-color:var(--blue);color:var(--text);background:var(--card)}
.photo{width:min(380px,100%);aspect-ratio:1;margin:auto;border-radius:50%;overflow:hidden;border:3px solid var(--blue);box-shadow:0 0 60px rgba(47,123,255,.35)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ph{font-size:4rem}
.photo.pop{--pop:1.3;position:relative;overflow:visible;background:radial-gradient(circle at 50% 35%,#12306b,#07122a)}
.photo.pop img{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--pop)*100%);object-fit:contain;object-position:center bottom;clip-path:inset(0 round 0 0 50% 50% / 0 0 calc(50% / var(--pop)) calc(50% / var(--pop)))}

/* about */
#about{background:var(--bg2)}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about .photo{border-radius:var(--r);aspect-ratio:4/5;width:min(320px,100%);box-shadow:none}
.about h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;margin-bottom:14px}
.about p{color:var(--mute);margin-bottom:24px;max-width:60ch}
.about b{color:var(--cyan);font-weight:700}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--blue)}
.card .img{aspect-ratio:16/10;overflow:hidden;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .body{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.85rem}
.tag{background:rgba(47,123,255,.15);color:var(--cyan);padding:2px 12px;border-radius:999px;font-weight:600}
.card h3{font-size:1.15rem}
.card p{font-size:.88rem;color:var(--mute);flex:1}
.card .btn{align-self:flex-start;margin-top:10px;padding:8px 20px;font-size:.9rem}

/* experience */
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:36px}
.tabs button{padding:10px 26px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.timeline{max-width:760px;margin:0 auto;border-left:2px solid var(--line);padding-left:28px;display:grid;gap:18px}
.tl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tl::before{content:"";position:absolute;left:-37px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--bg)}
.tl h3{font-size:1.1rem}
.tl h4{color:var(--cyan);font-weight:600;font-size:.95rem}
.tl .date{color:var(--mute);font-size:.85rem;margin:2px 0 8px}
.tl p{color:var(--mute);font-size:.92rem}
.tl .pic{aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-bottom:14px}
.tl .pic img{width:100%;height:100%;object-fit:cover}
[hidden]{display:none!important}

/* offer */
#offer{background:var(--bg2)}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.box h3{font-size:1.4rem;margin-bottom:8px}
.box>p{color:var(--mute);margin-bottom:18px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.88rem}

/* testimonials */
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px}
.rail .t{flex:0 0 min(340px,85%);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.t header{all:unset;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.t .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none}
.t .av img{width:100%;height:100%;object-fit:cover}
.t h3{font-size:1rem}
.t .star{color:#fbbf24;font-size:.85rem}
.t p{color:var(--mute);font-size:.92rem}

/* contact */
#contact{background:var(--bg2)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.contact h3{font-size:1.05rem;margin:14px 0 4px;color:var(--cyan)}
.contact h3:first-child{margin-top:0}
.contact .box p{color:var(--mute)}
.contact .intro{text-align:center;color:var(--mute);margin:-28px 0 36px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{padding:8px 18px;border-radius:999px;border:1px solid var(--line);font-size:.9rem;transition:.2s}
.links a:hover{background:var(--blue);border-color:var(--blue)}
.copy{margin-top:10px;padding:8px 20px;font-size:.9rem}
footer{text-align:center;padding:28px 0;color:var(--mute);font-size:.88rem;border-top:1px solid var(--line)}

 #burger{display:block}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

      { label: "Instagram", url: "https://instagram.com/sindaraaskr" },
      { label: "Email",     url: "mailto:sindarasekarhem@gmail.com" }
    ]
  },
  footer: "All Rights Reserved By Sindara"
};

/* ---------- render (tidak perlu diubah) ---------- */
const $ = id => document.getElementById(id);
const initials = s => s.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const link = (l, cls) => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`;
const media = (el, src, alt, label) => {
  if (src) el.innerHTML = `<img src="${src}" alt="${alt}" loading="lazy">`;
  else { el.classList.add('ph'); el.textContent = label; }
};

document.title = DATA.name + ' | Portfolio';
$('brand').textContent = DATA.brand;
$('name').textContent = DATA.name;
$('roles').innerHTML = DATA.roles.map(r => `<span>${r}</span>`).join('');
$('socials').innerHTML = DATA.socials.map(link).join('');
['resume1', 'resume2'].forEach(id => { DATA.resume ? $(id).href = DATA.resume : $(id).hidden = true; });
media($('heroPhoto'), DATA.photo, DATA.name, initials(DATA.name));
if (DATA.photo) $('heroPhoto').classList.add('pop');
media($('aboutPhoto'), DATA.aboutPhoto, DATA.name, initials(DATA.name));
$('aboutTitle').textContent = DATA.about.title;
$('aboutText').innerHTML = DATA.about.text;

$('projectGrid').innerHTML = DATA.projects.map((p, i) => `
  <article class="card">
    <div class="img ${p.image ? '' : 'ph'}">${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy">` : 'Project Image'}</div>
    <div class="body">
      <div class="meta"><span class="tag">${p.tag}</span><span>#${String(i + 1).padStart(2, '0')}</span></div>
      <h3>${p.title}</h3>
      <p>Techstack: ${p.stack}</p>
      <a class="btn" href="${p.link}" target="_blank" rel="noopener">View Project</a>
    </div>
  </article>`).join('');

const tl = arr => arr.map(e => `
  <div class="tl">
    ${e.image ? `<div class="pic"><img src="${e.image}" alt="${e.title}" loading="lazy"></div>` : ''}
    <h3>${e.title}</h3><h4>${e.place}</h4><div class="date">${e.date}</div><p>${e.desc}</p>
  </div>`).join('');
$('exp').innerHTML = tl(DATA.experience);
$('edu').innerHTML = tl(DATA.education);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('exp').hidden = b.dataset.tab !== 'exp';
  $('edu').hidden = b.dataset.tab !== 'edu';
});

$('skillTitle').textContent = DATA.skillsBox.title;
$('skillText').textContent = DATA.skillsBox.text;
$('skills').innerHTML = DATA.skills.map(s => `<li>${s}</li>`).join('');
$('toolTitle').textContent = DATA.toolsBox.title;
$('toolText').textContent = DATA.toolsBox.text;
$('tools').innerHTML = DATA.tools.map(s => `<li>${s}</li>`).join('');

$('rail').innerHTML = DATA.testimonials.map(t => `
  <div class="t">
    <header><div class="av ${t.photo ? '' : 'ph'}">${t.photo ? `<img src="${t.photo}" alt="${t.role}">` : '&#9679;'}</div>
    <div><h3>${t.role}</h3><span class="star">&#9733; ${t.rating}</span></div></header>
    <p>${t.text}</p>
  </div>`).join('');

$('intro').textContent = DATA.contact.intro;
$('email').textContent = DATA.contact.email;
$('loc').textContent = DATA.contact.location;
$('cSocials').innerHTML = DATA.socials.map(link).join('');
$('cMsg').innerHTML = DATA.contact.message.map(link).join('');
$('copyBtn').onclick = async e => {
  try { await navigator.clipboard.writeText(DATA.contact.email); e.target.textContent = 'Copied'; }
  catch { e.target.textContent = DATA.contact.email; }
  setTimeout(() => e.target.textContent = 'Copy Email', 1800);
};
$('footer').textContent = '\u00A9 ' + new Date().getFullYear() + ' ' + DATA.footer;

$('burger').onclick = () => $('menu').classList.toggle('open');
$('menu').onclick = () => $('menu').classList.remove('open');
</script>
</body>
</html>
